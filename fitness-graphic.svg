<svg viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="200" rx="0" fill="#f0f9ff"/>

  <!-- ===== FIGURE 1 — Pull-up (left) ===== -->
  <!-- Pull-up bar -->
  <rect x="30" y="28" width="110" height="6" rx="3" fill="#0369a1" opacity="0.7"/>
  <rect x="30"  y="18" width="8" height="16" rx="3" fill="#0369a1" opacity="0.5"/>
  <rect x="132" y="18" width="8" height="16" rx="3" fill="#0369a1" opacity="0.5"/>

  <!-- Head -->
  <circle cx="85" cy="68" r="16" stroke="#0284c7" stroke-width="2.5" fill="rgba(2,132,199,0.08)"/>
  <!-- Neck -->
  <line x1="85" y1="84" x2="85" y2="96" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="85" y1="96" x2="85" y2="148" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms up to bar -->
  <line x1="78" y1="100" x2="58" y2="60" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="60" x2="52" y2="34" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="100" x2="112" y2="60" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="60" x2="118" y2="34" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs hanging bent -->
  <line x1="80"  y1="148" x2="68"  y2="178" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68"  y1="178" x2="78"  y2="195" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90"  y1="148" x2="102" y2="178" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="102" y1="178" x2="92"  y2="195" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Joints -->
  <circle cx="58" cy="60"  r="3.5" fill="#0284c7"/>
  <circle cx="112" cy="60" r="3.5" fill="#0284c7"/>
  <circle cx="68" cy="178" r="3"   fill="rgba(2,132,199,0.7)"/>
  <circle cx="102" cy="178" r="3"  fill="rgba(2,132,199,0.7)"/>

  <!-- Label -->
  <text x="85" y="196" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#0369a1" opacity="0.7">Pull-up</text>

  <!-- ===== FIGURE 2 — Push-up (center) ===== -->
  <!-- Ground line -->
  <line x1="170" y1="168" x2="330" y2="168" stroke="rgba(2,132,199,0.25)" stroke-width="2" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="310" cy="115" r="16" stroke="#0284c7" stroke-width="2.5" fill="rgba(2,132,199,0.08)"/>
  <!-- Neck + torso (horizontal) -->
  <line x1="295" y1="122" x2="240" y2="145" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm (front, elbow bent) -->
  <line x1="288" y1="130" x2="274" y2="150" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="274" y1="150" x2="280" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm (back) -->
  <line x1="255" y1="140" x2="240" y2="155" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="155" x2="245" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hips -->
  <circle cx="240" cy="145" r="4" fill="#0284c7"/>
  <!-- Legs straight back -->
  <line x1="237" y1="148" x2="210" y2="158" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="210" y1="158" x2="183" y2="164" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="183" y1="164" x2="178" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Joints -->
  <circle cx="274" cy="150" r="3.5" fill="#0284c7"/>
  <circle cx="240" cy="155" r="3.5" fill="#0284c7"/>
  <circle cx="210" cy="158" r="3"   fill="rgba(2,132,199,0.7)"/>

  <!-- Label -->
  <text x="247" y="192" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#0369a1" opacity="0.7">Push-up</text>

  <!-- ===== FIGURE 3 — Squat (right) ===== -->
  <!-- Head -->
  <circle cx="415" cy="48" r="16" stroke="#0284c7" stroke-width="2.5" fill="rgba(2,132,199,0.08)"/>
  <!-- Neck -->
  <line x1="415" y1="64" x2="415" y2="78" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso (slightly forward lean) -->
  <line x1="415" y1="78" x2="408" y2="128" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms forward for balance -->
  <line x1="412" y1="92" x2="382" y2="108" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="382" y1="108" x2="365" y2="120" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="418" y1="92" x2="435" y2="105" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="435" y1="105" x2="448" y2="116" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hips (deep squat) -->
  <circle cx="408" cy="128" r="4.5" fill="#0284c7"/>
  <!-- Left leg (bent) -->
  <line x1="404" y1="130" x2="385" y2="155" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="385" y1="155" x2="378" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg (bent) -->
  <line x1="412" y1="130" x2="438" y2="155" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="438" y1="155" x2="448" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ground line right -->
  <line x1="365" y1="168" x2="460" y2="168" stroke="rgba(2,132,199,0.25)" stroke-width="2" stroke-linecap="round"/>
  <!-- Feet -->
  <line x1="378" y1="168" x2="365" y2="170" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="448" y1="168" x2="460" y2="170" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Joints -->
  <circle cx="385" cy="155" r="3.5" fill="#0284c7"/>
  <circle cx="438" cy="155" r="3.5" fill="#0284c7"/>

  <!-- Label -->
  <text x="415" y="192" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#0369a1" opacity="0.7">Squat</text>
</svg>
