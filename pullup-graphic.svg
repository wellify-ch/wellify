<svg viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="200" fill="#f0f9ff"/>

  <!-- Pull-up bar (horizontal) -->
  <line x1="160" y1="30" x2="340" y2="30" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Bar supports (left & right) -->
  <line x1="165" y1="18" x2="165" y2="38" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <line x1="335" y1="18" x2="335" y2="38" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity=".5"/>

  <!-- Hands gripping bar -->
  <circle cx="230" cy="33" r="5" fill="#0284c7"/>
  <circle cx="270" cy="33" r="5" fill="#0284c7"/>

  <!-- Arms (bent — chin above bar position) -->
  <line x1="230" y1="33" x2="222" y2="58" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270" y1="33" x2="278" y2="58" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Shoulders -->
  <line x1="222" y1="58" x2="278" y2="58" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head (above shoulders, chin near bar) -->
  <circle cx="250" cy="50" r="14" stroke="#0284c7" stroke-width="2.5" fill="rgba(2,132,199,0.08)"/>

  <!-- Torso -->
  <line x1="250" y1="64" x2="250" y2="110" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hips -->
  <circle cx="250" cy="110" r="4" fill="#0284c7"/>

  <!-- Legs hanging down (slightly bent) -->
  <line x1="250" y1="110" x2="238" y2="148" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="238" y1="148" x2="236" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="110" x2="262" y2="148" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="262" y1="148" x2="264" y2="168" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Knee joints -->
  <circle cx="238" cy="148" r="3.5" fill="#0284c7"/>
  <circle cx="262" cy="148" r="3.5" fill="#0284c7"/>

  <!-- Elbow joints -->
  <circle cx="222" cy="58" r="3.5" fill="#0284c7"/>
  <circle cx="278" cy="58" r="3.5" fill="#0284c7"/>

  <!-- Effort lines (right side) -->
  <line x1="300" y1="44" x2="324" y2="38" stroke="rgba(2,132,199,0.28)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,4"/>
  <line x1="304" y1="56" x2="330" y2="56" stroke="rgba(2,132,199,0.28)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,4"/>
  <line x1="300" y1="68" x2="322" y2="74" stroke="rgba(2,132,199,0.28)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,4"/>

  <!-- Sweat drops -->
  <circle cx="292" cy="38" r="2"   fill="rgba(2,132,199,0.22)"/>
  <circle cx="298" cy="30" r="1.5" fill="rgba(2,132,199,0.18)"/>
  <circle cx="286" cy="33" r="1.5" fill="rgba(2,132,199,0.16)"/>
</svg>
