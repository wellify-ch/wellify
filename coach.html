<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wellify — Coach Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #0369a1;
      --blue-mid: #0284c7;
      --blue-light: #38bdf8;
      --blue-pale: #e0f2fe;
      --blue-subtle: #f0f9ff;
      --dark: #0f172a;
      --dark-2: #1e293b;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --cream: #f8fafc;
      --white: #fff;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --orange: #ea580c;
      --orange-bg: #fff7ed;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --radius: 12px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

    /* AUTH GATE */
    #authGate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0369a1 0%, #082f49 100%);
      padding: 24px;
    }
    .auth-card {
      background: var(--white);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
      text-align: center;
    }
    .auth-logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 8px;
    }
    .auth-sub { font-size: 14px; color: var(--muted); margin-bottom: 36px; }
    .auth-card label { display: block; font-size: 13px; font-weight: 500; color: var(--dark); margin-bottom: 6px; text-align: left; }
    .auth-card input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .2s;
    }
    .auth-card input:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
    .auth-btn {
      width: 100%;
      padding: 15px;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .auth-btn:hover { background: var(--blue-mid); transform: translateY(-1px); }
    .auth-error { margin-top: 14px; font-size: 13px; color: var(--red); }

    /* DASHBOARD */
    #dashboard { display: none; min-height: 100vh; }

    .dash-header {
      background: var(--dark);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,.2);
    }
    .dash-logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--white);
    }
    .dash-logo span { font-size: 12px; font-family: 'Inter', sans-serif; color: rgba(255,255,255,.4); margin-left: 8px; font-weight: 400; }
    .dash-logout {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.7);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .dash-logout:hover { background: rgba(255,255,255,.14); color: var(--white); }

    .dash-main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

    /* STATS */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .stat-card__label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
    .stat-card__value { font-size: 36px; font-weight: 700; color: var(--dark); line-height: 1; }
    .stat-card--new .stat-card__value { color: var(--blue); }

    /* FILTER TABS */
    .dash-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--muted);
      transition: all .2s;
    }
    .filter-tab:hover { border-color: var(--blue-light); color: var(--blue); }
    .filter-tab.active { background: var(--blue); border-color: var(--blue); color: var(--white); }

    /* REALTIME BADGE */
    .dash-live {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--green);
      margin-bottom: 16px;
    }
    .dash-live__dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* BOOKING CARDS */
    .booking-list { display: flex; flex-direction: column; gap: 16px; }
    .booking-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }
    .booking-empty p { font-size: 15px; }

    .booking-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: box-shadow .2s;
    }
    .booking-card:hover { box-shadow: 0 4px 24px rgba(3,105,161,.08); }
    .booking-card--neu { border-left: 4px solid var(--blue); }
    .booking-card--kontaktiert { border-left: 4px solid var(--orange); }
    .booking-card--abgeschlossen { border-left: 4px solid var(--green); opacity: .75; }

    .booking-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .booking-card__name { font-size: 17px; font-weight: 600; color: var(--dark); }
    .booking-card__date { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      flex-shrink: 0;
    }
    .status-badge--neu { background: var(--blue-pale); color: var(--blue); }
    .status-badge--kontaktiert { background: var(--orange-bg); color: var(--orange); }
    .status-badge--abgeschlossen { background: var(--green-bg); color: var(--green); }

    .booking-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .meta-item a { color: var(--blue); text-decoration: none; font-weight: 500; }
    .meta-item a:hover { text-decoration: underline; }

    .booking-card__message {
      font-size: 14px;
      color: var(--text);
      background: var(--cream);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      line-height: 1.6;
      font-style: italic;
      border: 1px solid var(--border);
    }

    .booking-card__actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .action-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--text);
      transition: all .15s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .action-btn:hover { border-color: var(--blue-light); color: var(--blue); }
    .action-btn--whatsapp { background: #25D366; border-color: #25D366; color: var(--white); }
    .action-btn--whatsapp:hover { background: #1ebe5d; border-color: #1ebe5d; color: var(--white); }
    .action-btn--status { background: var(--blue-subtle); border-color: var(--blue-light); color: var(--blue); }
    .action-btn--done { background: var(--green-bg); border-color: #86efac; color: var(--green); }
    .action-btn--loading { opacity: .5; pointer-events: none; }

    /* NEW BADGE */
    .new-flash {
      animation: flashIn .4s ease;
    }
    @keyframes flashIn {
      from { opacity:0; transform: translateY(-8px); }
      to { opacity:1; transform: translateY(0); }
    }

    /* NOTIFICATION TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--dark);
      color: var(--white);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 40px rgba(0,0,0,.3);
      z-index: 9999;
      transition: all .3s;
      transform: translateY(0);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.hidden { transform: translateY(80px); opacity: 0; }
    .toast__icon { font-size: 18px; }

    @media (max-width: 640px) {
      .dash-stats { grid-template-columns: 1fr 1fr; }
      .dash-stats .stat-card:last-child { grid-column: 1 / -1; }
      .booking-card__top { flex-direction: column; }
      .dash-header { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <!-- AUTH GATE -->
  <div id="authGate">
    <div class="auth-card">
      <div class="auth-logo">Wellify</div>
      <p class="auth-sub">Coach Dashboard — Nur für Yannic</p>
      <div>
        <label for="authPass">Passwort</label>
        <input type="password" id="authPass" placeholder="••••••••••" autocomplete="current-password" />
        <button class="auth-btn" id="authBtn">Einloggen</button>
        <p class="auth-error" id="authError"></p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <header class="dash-header">
      <div class="dash-logo">Wellify <span>Coach Dashboard</span></div>
      <button class="dash-logout" id="logoutBtn">Abmelden</button>
    </header>

    <main class="dash-main">
      <!-- Stats -->
      <div class="dash-stats" id="dashStats">
        <div class="stat-card">
          <div class="stat-card__label">Alle Anfragen</div>
          <div class="stat-card__value" id="statTotal">—</div>
        </div>
        <div class="stat-card stat-card--new">
          <div class="stat-card__label">Neu / Ungelesen</div>
          <div class="stat-card__value" id="statNew">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Diese Woche</div>
          <div class="stat-card__value" id="statWeek">—</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="dash-filters">
        <button class="filter-tab active" data-filter="alle">Alle</button>
        <button class="filter-tab" data-filter="neu">Neu</button>
        <button class="filter-tab" data-filter="kontaktiert">Kontaktiert</button>
        <button class="filter-tab" data-filter="abgeschlossen">Abgeschlossen</button>
      </div>

      <!-- Live indicator -->
      <div class="dash-live">
        <div class="dash-live__dot"></div>
        Live — neue Anfragen erscheinen sofort
      </div>

      <!-- Booking list -->
      <div class="booking-list" id="bookingList">
        <div class="booking-empty"><p>Wird geladen…</p></div>
      </div>
    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast hidden" id="toast">
    <span class="toast__icon">🔔</span>
    <span id="toastMsg">Neue Anfrage!</span>
  </div>

  <script>
    const COACH_PASSWORD = 'Wellify2026!';
    const SB_URL = 'https://uffhybgxcgeckbneaxbu.supabase.co';
    const SB_KEY = 'sb_publishable_MDZD3zpTZdYHmauPbouwVw_ARIMngEB';
    const COACH_SECRET = 'WellifyCoachAccess2026';

    // ——— AUTH ———
    const authGate = document.getElementById('authGate');
    const dashboard = document.getElementById('dashboard');
    const authError = document.getElementById('authError');

    function checkAuth() {
      return sessionStorage.getItem('wellify_coach') === COACH_PASSWORD;
    }

    if (checkAuth()) showDashboard();

    document.getElementById('authBtn').addEventListener('click', doLogin);
    document.getElementById('authPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    function doLogin() {
      const val = document.getElementById('authPass').value;
      if (val === COACH_PASSWORD) {
        sessionStorage.setItem('wellify_coach', val);
        authError.textContent = '';
        showDashboard();
      } else {
        authError.textContent = 'Falsches Passwort.';
        document.getElementById('authPass').value = '';
        document.getElementById('authPass').focus();
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('wellify_coach');
      location.reload();
    });

    // ——— SUPABASE ———
    let sbClient;
    let allBookings = [];
    let activeFilter = 'alle';

    function showDashboard() {
      authGate.style.display = 'none';
      dashboard.style.display = 'block';
      initSupabase();
    }

    function initSupabase() {
      sbClient = window.supabase.createClient(SB_URL, SB_KEY, {
        global: { headers: { 'x-coach-secret': COACH_SECRET } }
      });
      loadBookings();
      subscribeRealtime();
    }

    async function loadBookings() {
      const { data, error } = await sbClient
        .from('bookings')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('bookingList').innerHTML =
          '<div class="booking-empty"><p>Fehler beim Laden. Bitte Seite neu laden.</p></div>';
        return;
      }
      allBookings = data || [];
      renderStats();
      renderBookings();
    }

    function subscribeRealtime() {
      sbClient
        .channel('bookings-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, payload => {
          allBookings.unshift(payload.new);
          renderStats();
          renderBookings(true);
          showToast('Neue Anfrage von ' + payload.new.name + '!');
        })
        .subscribe();
    }

    // ——— STATS ———
    function renderStats() {
      const total = allBookings.length;
      const neu = allBookings.filter(b => b.status === 'neu').length;
      const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
      const week = allBookings.filter(b => new Date(b.created_at) >= weekAgo).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statNew').textContent = neu;
      document.getElementById('statWeek').textContent = week;
    }

    // ——— FILTER TABS ———
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeFilter = tab.dataset.filter;
        renderBookings();
      });
    });

    // ——— RENDER BOOKINGS ———
    function renderBookings(flash = false) {
      const filtered = activeFilter === 'alle'
        ? allBookings
        : allBookings.filter(b => b.status === activeFilter);

      const list = document.getElementById('bookingList');

      if (filtered.length === 0) {
        list.innerHTML = '<div class="booking-empty"><p>Keine Anfragen in dieser Kategorie.</p></div>';
        return;
      }

      list.innerHTML = filtered.map((b, i) => renderCard(b, flash && i === 0)).join('');

      list.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', () => updateStatus(btn.dataset.id, btn.dataset.status, btn));
      });
    }

    function renderCard(b, flash) {
      const date = new Date(b.created_at);
      const dateStr = date.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const waPhone = (b.phone || '').replace(/[\s\-\+]/g, '');
      const waMsg = encodeURIComponent('Hallo ' + b.name + ', danke für deine Anfrage bei Wellify! Ich würde mich gerne mit dir für ein kostenloses Erstgespräch melden.');
      const waLink = waPhone ? `https://wa.me/${waPhone}?text=${waMsg}` : '';

      const statusBadge = {
        neu: '<span class="status-badge status-badge--neu">Neu</span>',
        kontaktiert: '<span class="status-badge status-badge--kontaktiert">Kontaktiert</span>',
        abgeschlossen: '<span class="status-badge status-badge--abgeschlossen">Abgeschlossen</span>'
      }[b.status] || '<span class="status-badge status-badge--neu">Neu</span>';

      const nextStatusBtn = b.status === 'neu'
        ? `<button class="action-btn action-btn--status status-btn" data-id="${b.id}" data-status="kontaktiert">Kontaktiert markieren</button>`
        : b.status === 'kontaktiert'
        ? `<button class="action-btn action-btn--done status-btn" data-id="${b.id}" data-status="abgeschlossen">Abschliessen</button>`
        : `<button class="action-btn status-btn" data-id="${b.id}" data-status="neu">Wieder öffnen</button>`;

      return `
        <div class="booking-card booking-card--${b.status || 'neu'} ${flash ? 'new-flash' : ''}" id="card-${b.id}">
          <div class="booking-card__top">
            <div>
              <div class="booking-card__name">${escHtml(b.name)}</div>
              <div class="booking-card__date">${dateStr}</div>
            </div>
            ${statusBadge}
          </div>
          <div class="booking-card__meta">
            ${b.phone ? `<div class="meta-item">📱 <a href="tel:${escHtml(b.phone)}">${escHtml(b.phone)}</a></div>` : ''}
            ${b.service ? `<div class="meta-item">🎯 ${escHtml(b.service)}</div>` : ''}
          </div>
          ${b.message ? `<div class="booking-card__message">"${escHtml(b.message)}"</div>` : ''}
          <div class="booking-card__actions">
            ${waLink ? `<a href="${waLink}" target="_blank" rel="noopener" class="action-btn action-btn--whatsapp">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              WhatsApp
            </a>` : ''}
            ${nextStatusBtn}
          </div>
        </div>`;
    }

    // ——— UPDATE STATUS ———
    async function updateStatus(id, newStatus, btn) {
      btn.classList.add('action-btn--loading');
      const { error } = await sbClient
        .from('bookings')
        .update({ status: newStatus })
        .eq('id', id);

      if (!error) {
        const idx = allBookings.findIndex(b => b.id === id);
        if (idx !== -1) allBookings[idx].status = newStatus;
        renderStats();
        renderBookings();
      } else {
        btn.classList.remove('action-btn--loading');
        alert('Fehler beim Aktualisieren.');
      }
    }

    // ——— TOAST ———
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 5000);
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
