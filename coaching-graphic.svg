<svg viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="200" fill="#f0f9ff"/>

  <!-- Holistic backdrop circle -->
  <circle cx="250" cy="106" r="80" stroke="rgba(2,132,199,0.10)" stroke-width="1.5" fill="rgba(2,132,199,0.04)"/>
  <!-- Inner ring -->
  <circle cx="250" cy="106" r="60" stroke="rgba(2,132,199,0.06)" stroke-width="1" fill="none"/>

  <!-- Ground line -->
  <line x1="172" y1="179" x2="328" y2="179" stroke="rgba(2,132,199,0.25)" stroke-width="2" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="250" cy="37" r="16" stroke="#0284c7" stroke-width="2.5" fill="rgba(2,132,199,0.08)"/>
  <!-- Neck -->
  <line x1="250" y1="53" x2="250" y2="67" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="250" y1="67" x2="250" y2="126" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left arm: wide open upward -->
  <line x1="244" y1="78"  x2="195" y2="64" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="195" y1="64"  x2="158" y2="57" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm: wide open upward -->
  <line x1="256" y1="78"  x2="305" y2="64" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="305" y1="64"  x2="342" y2="57" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Elbow joints -->
  <circle cx="195" cy="64"  r="3.5" fill="#0284c7"/>
  <circle cx="305" cy="64"  r="3.5" fill="#0284c7"/>

  <!-- Hand indicators -->
  <circle cx="158" cy="57"  r="4.5" fill="rgba(2,132,199,0.28)" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="342" cy="57"  r="4.5" fill="rgba(2,132,199,0.28)" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Left leg (slight V stance) -->
  <line x1="246" y1="128" x2="224" y2="160" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="224" y1="160" x2="218" y2="177" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="254" y1="128" x2="276" y2="160" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="276" y1="160" x2="282" y2="177" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Knee joints -->
  <circle cx="224" cy="160" r="3.5" fill="#0284c7"/>
  <circle cx="276" cy="160" r="3.5" fill="#0284c7"/>

  <!-- Small heart on chest -->
  <path d="M250,93 C250,93 246,88 242,88 C238,88 236,92 238,96 C240,100 250,107 250,107 C250,107 260,100 262,96 C264,92 262,88 258,88 C254,88 250,93 250,93Z"
        fill="rgba(2,132,199,0.30)" stroke="#0284c7" stroke-width="1"/>
</svg>
